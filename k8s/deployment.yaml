apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexvia-fraud-api
  labels:
    app: nexvia-fraud-api
    tier: api
    project: nexvia-fraud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexvia-fraud-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: nexvia-fraud-api
        tier: api
        project: nexvia-fraud
    spec:
      containers:
        - name: fraud-api
          image: nexvia-fraud-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: nexvia-api-config
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
